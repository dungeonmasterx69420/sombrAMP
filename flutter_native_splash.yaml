# The System S desk colour (lib/sombra/system_s.dart). Dark is the app's default theme, so the splash is
# dark in both system modes.
flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#0A0A0A"
  color_dark: "#0A0A0A"
  image: assets/icon/sombra_splash.png
  image_ios: assets/icon/sombra_splash_ios.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

  info_plist_files:
    - ios/Runner/Info-Debug.plist
    - ios/Runner/Info-Profile.plist
    - ios/Runner/Info-Release.plist

  android_12:
    color: "#0A0A0A"
    color_dark: "#0A0A0A"
    image: assets/icon/sombra_splash.png
